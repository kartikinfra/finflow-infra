apiVersion: v1
kind: ServiceAccount
metadata: 
  name: falco-receiver-sa
  namespace: monitoring

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-receiver-role
  namespace: finflow
rules:
  - apiGroups: [""]
    resources: ["pods","pods/exec"]
    verbs: ["get","create"]
    resourceNames: ["attack-target"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-receiver-rolebinding
  namespace: finflow
subjects:
  - kind: ServiceAccount
    name: falco-receiver-sa
    namespace: monitoring
roleRef:
  kind: Role
  name: falco-receiver-role
  apiGroup: rbac.authorization.k8s.io


