apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n

spec:
  replicas: 1

  selector:
    matchLabels:
      app: n8n

  template:
    metadata:
      labels:
        app: n8n

    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:latest

          ports:
            - containerPort: 5678

          env:
            - name: N8N_HOST
              value: "n8n.kartikinfra.in"

            - name: N8N_PROTOCOL
              value: "https"

            - name: WEBHOOK_URL
              value: "https://n8n.kartikinfra.in/"

            - name: N8N_BASIC_AUTH_ACTIVE
              value: "true"

            - name: N8N_BASIC_AUTH_USER
              value: "kartik"

            - name:  N8N_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-auth
                  key: password
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"

          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-pvc
