grafana:
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
      org_name: Main Org.

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          folder: ''
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/default
  additionalDataSources:
    - name: tempo
      type: tempo
      uid: ffj1etsw8c2kgc
      url: http://tempo.monitoring.svc.cluster.local:3200

