customRules:
  falco_rules.local.yaml: |-
    - macro: user_known_contact_k8s_api_server_activities
      condition: or container.name contains "grafana-sc-datasources"
      override:
        condition: append
    - rule: postgres-shell-exec-detection
      desc: Detect shell execution inside postgres container
      condition: >
        spawned_process
        and proc.name in (bash, sh, zsh)
        and container
        and container.image.repository contains "postgres"
      output: >
        Postgres container shell detected |
        process=%proc.name cmd=%proc.cmdline container=%container.name
      priority: CRITICAL
      tags: [postgres, security, k8s]
    - rule: outbound-rule-no-unathorized-trafic-can-come-insidethePod
      desc: outbound traffic detected from container
      condition: >
        outbound
        and container
        and not container.name contains "coredns"
      output: >
        container outbound network detected |
        connection=%fd.name process=%proc.name
      priority: WARNING
falco:
  json_output: true
  http_output:
    enabled: true
    url: http://falcosidekick.monitoring.svc.cluster.local:2801
